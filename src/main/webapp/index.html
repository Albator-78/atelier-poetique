<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atelier Poétique (Java WebAssembly)</title>
  <style>
    body {
      font-family: "Georgia", serif;
      background: #faf8f5;
      color: #2c2a29;
      display: flex;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .container {
      max-width: 600px;
      width: 100%;
      background: #fff;
      padding: 2.5rem;
      border-radius: 8px;
      border: 1px solid #e6e0d8;
    }
    h1 { color: #8c4a32; text-align: center; font-size: 1.5rem; }
    .poeme-box {
      background: #faf8f5;
      border-left: 3px solid #8c4a32;
      padding: 1.5rem;
      margin: 1.5rem 0;
      font-size: 1.25rem;
      line-height: 1.8;
      font-style: italic;
    }
    button {
      width: 100%;
      padding: 0.85rem;
      background: #8c4a32;
      color: #fff;
      border: none;
      border-radius: 5px;
      font-size: 1rem;
      cursor: pointer;
    }
    .analyse {
      margin-top: 1.5rem;
      padding-top: 1rem;
      border-top: 1px solid #e6e0d8;
      font-family: system-ui, sans-serif;
      font-size: 0.9rem;
    }
  </style>
  <script src="classes.wasm-runtime.js"></script>
</head>
<body>

<div class="container">
  <h1>Atelier Poétique (Java Wasm)</h1>
  <div class="poeme-box" id="poeme">Chargement du module WebAssembly...</div>
  <button id="btn-generer" disabled>Composer un nouveau haïku</button>
  <div class="analyse" id="analyse"></div>
</div>

<script>
  const VERS_5 = [
    "Le vent d'automne",
    "Sous la lune claire",
    "Une feuille tombe",
    "L'eau calme du lac",
    "Dans le silence"
  ];
  const VERS_7 = [
    "Murmure à travers les bois",
    "Les ombres dansent sans bruit",
    "Un papillon bleu s'envole",
    "La pluie caresse la terre",
    "L'étoile brille dans la nuit"
  ];

  let wasmExports = null;

  function rafraichirAffichage() {
    wasmExports.nouveauHaiku();

    const v1 = VERS_5[wasmExports.getIndexVers(1)];
    const v2 = VERS_7[wasmExports.getIndexVers(2)];
    const v3 = VERS_5[wasmExports.getIndexVers(3)];

    document.getElementById("poeme").innerHTML = `${v1}<br>${v2}<br>${v3}`;

    const s1 = wasmExports.getSyllabesVers(1);
    const s2 = wasmExports.getSyllabesVers(2);
    const s3 = wasmExports.getSyllabesVers(3);
    const rime = wasmExports.aRimeEmbrassee() === 1;

    document.getElementById("analyse").innerHTML = `
      <ul>
        <li>Vers 1 : « ${v1} » — <strong>${s1} syllabes</strong></li>
        <li>Vers 2 : « ${v2} » — <strong>${s2} syllabes</strong></li>
        <li>Vers 3 : « ${v3} » — <strong>${s3} syllabes</strong></li>
      </ul>
      <p>Rime embrassée (Vers 1 & 3) : <strong>${rime ? "Oui" : "Non (vers libres)"}</strong></p>
    `;
  }

  window.addEventListener("load", async () => {
    const teavm = await TeaVM.wasm.load("classes.wasm");
    wasmExports = teavm.exports;
    const btn = document.getElementById("btn-generer");
    btn.disabled = false;
    btn.addEventListener("click", rafraichirAffichage);
    rafraichirAffichage();
  });
</script>

</body>
</html>
