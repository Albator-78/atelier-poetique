<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atelier Poétique (Java WebAssembly)</title>
  <style>
    body {
      font-family: "Georgia", serif;
      background: #faf8f5;
      color: #2c2a29;
      display: flex;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .container {
      max-width: 600px;
      width: 100%;
      background: #fff;
      padding: 2.5rem;
      border-radius: 8px;
      border: 1px solid #e6e0d8;
    }
    h1 { color: #8c4a32; text-align: center; font-size: 1.5rem; }
    .poeme-box {
      background: #faf8f5;
      border-left: 3px solid #8c4a32;
      padding: 1.5rem;
      margin: 1.5rem 0;
      font-size: 1.25rem;
      line-height: 1.8;
      font-style: italic;
    }
    button {
      width: 100%;
      padding: 0.85rem;
      background: #8c4a32;
      color: #fff;
      border: none;
      border-radius: 5px;
      font-size: 1rem;
      cursor: pointer;
    }
    .analyse {
      margin-top: 1.5rem;
      padding-top: 1rem;
      border-top: 1px solid #e6e0d8;
      font-family: system-ui, sans-serif;
      font-size: 0.9rem;
    }
  </style>
  <!-- Chargeur WebAssembly généré par TeaVM -->
  <script type="text/javascript" charset="utf-8" src="wasm-runtime.js"></script>
  <script>
    window.addEventListener("load", () => {
      TeaVM.wasm.run("classes.wasm");
    });
  </script>
</head>
<body>

<div class="container">
  <h1>Atelier Poétique (Java Wasm)</h1>
  <div class="poeme-box" id="poeme">Chargement du module WebAssembly...</div>
  <button id="btn-generer">Composer un nouveau haïku</button>
  <div class="analyse" id="analyse"></div>
</div>

</body>
</html>
